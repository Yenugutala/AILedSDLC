tables:
- name: securities_master
  catalog: statestreet
  schema: g_statestreet
  description: "Gold wide table \u2014 Securities Master analytics mart. Grain: one\
    \ row per active security version (is_current = TRUE)."
  columns:
  - name: net_settlement_amount
    type: DECIMAL(18,6)
    description: "Net cash amount due at settlement for BOND and MUNI security types,\
      \ derived as principal_amount \xD7 (1 + accrued_interest_rate) from silver bond\
      \ source. NULL for all other product types. Requirement REQ-01/REQ-02/REQ-03."
    nullable: true
