tables:
- name: securities_master
  catalog: statestreet
  schema: g_statestreet
  description: "Gold wide table \u2014 Securities Master analytics mart. Grain: one\
    \ row per active security version (is_current = TRUE)."
  columns:
  - name: net_settlement_amount
    type: DECIMAL(18,6)
    description: "Net cash amount due at settlement for bond and muni security types,\
      \ calculated as principal_amount \xD7 (1 + accrued_interest_rate) sourced from\
      \ the silver bond layer. Populated only where product_type IN ('bond', 'muni')\
      \ and is_current = TRUE (active SCD2 version). Implements REQ-01/REQ-02 from\
      \ the Gold Securities Master Table enhancement request."
    nullable: true
