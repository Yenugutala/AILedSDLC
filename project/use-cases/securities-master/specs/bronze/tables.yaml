  # -----------------------------------------------------------------------
  # METADATA / DQ REFERENCE TABLES (Bronze-only — no Silver/Gold per USE-CASE-001)
  # -----------------------------------------------------------------------
  - name: dq_rules_catalog
    source_file: dq_rules_catalog.csv
    description: "DQ framework metadata table — catalog of all 128 DQ rules. Bronze-only ingestion; no Silver conformance or Gold mart treatment."
    primary_key: [rule_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    bronze_only: true
    columns:
      - {name: rule_id,          type: STRING,  nullable: false, description: "Unique DQ rule identifier (PK)"}
      - {name: table_name,       type: STRING,  nullable: true,  description: "Target table for this rule"}
      - {name: column_name,      type: STRING,  nullable: true,  description: "Target column for this rule"}
      - {name: dq_dimension,     type: STRING,  nullable: true,  description: "DQ dimension: Validity, Completeness, Uniqueness, Consistency, Accuracy, Timeliness"}
      - {name: rule_type,        type: STRING,  nullable: true,  description: "Rule category: ENUM_MEMBERSHIP, NOT_NULL, REFERENTIAL_INTEGRITY, etc."}
      - {name: severity,         type: STRING,  nullable: true,  description: "HIGH, MEDIUM, or LOW"}
      - {name: description,      type: STRING,  nullable: true,  description: "Human-readable rule description"}
      - {name: sql,              type: STRING,  nullable: true,  description: "SQL SELECT returning failing rows"}
      - {name: allowed_values,   type: STRING,  nullable: true,  description: "Comma-separated list of allowed values (for ENUM rules)"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: dq_issues_catalog
    source_file: dq_issues_catalog.csv
    description: "DQ framework metadata table — log of known DQ issues and resolutions. Bronze-only ingestion; no Silver conformance or Gold mart treatment."
    primary_key: [issue_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    bronze_only: true
    columns:
      - {name: issue_id,         type: STRING,  nullable: false, description: "Unique issue identifier (PK)"}
      - {name: rule_id,          type: STRING,  nullable: true,  description: "FK to dq_rules_catalog.rule_id"}
      - {name: table_name,       type: STRING,  nullable: true,  description: "Table where issue was observed"}
      - {name: description,      type: STRING,  nullable: true,  description: "Issue description"}
      - {name: root_cause,       type: STRING,  nullable: true,  description: "Root cause analysis"}
      - {name: workaround,       type: STRING,  nullable: true,  description: "Applied workaround or resolution notes"}
      - {name: status,           type: STRING,  nullable: true,  description: "OPEN, RESOLVED, ACCEPTED"}
      - {name: discovered_date,  type: DATE,    nullable: true,  description: "Date issue was first identified"}
      - {name: resolved_date,    type: DATE,    nullable: true,  description: "Date issue was resolved (NULL if open)"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

# -----------------------------------------------------------------------
# SCHEMA DRIFT AUDIT TABLES (Created by pipeline setup — not from CSV)
# -----------------------------------------------------------------------
internal_tables:
  - name: _schema_changes
    description: "Audit log for all additive and breaking schema drift events. Append-only."
    columns:
      - {name: table_name,       type: STRING,    nullable: false}
      - {name: change_type,      type: STRING,    nullable: false, description: "ADDITIVE or BREAKING"}
      - {name: columns_affected, type: STRING,    nullable: true}
      - {name: detected_at,      type: TIMESTAMP, nullable: false}

  - name: _schema_quarantine
    description: "Registry of quarantined batches due to breaking schema drift. Human-resolved."
    columns:
      - {name: batch_id,         type: STRING,    nullable: false}
      - {name: table_name,       type: STRING,    nullable: false}
      - {name: change_type,      type: STRING,    nullable: true}
      - {name: columns_affected, type: STRING,    nullable: true}
      - {name: quarantined_at,   type: TIMESTAMP, nullable: false}
      - {name: resolved_by,      type: STRING,    nullable: true}
      - {name: resolved_at,      type: TIMESTAMP, nullable: true}
      - {name: resolution_note,  type: STRING,    nullable: true}
