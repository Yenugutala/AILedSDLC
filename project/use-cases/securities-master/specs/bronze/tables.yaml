layer: bronze
catalog: statestreet
schema: b_statestreet
description: "Bronze landing layer for Securities Master Data. Raw ingestion of 29 CSV source files from Databricks Volume. No transformation applied — schema drift handled per drift policy."
volume_path: /Volumes/statestreet/securities_master/raw_files/

tables:

  # -----------------------------------------------------------------------
  # CORE / BASE TABLE
  # -----------------------------------------------------------------------
  - name: product
    source_file: product.csv
    description: "Base table for all securities. Every security has exactly one row here regardless of subtype. Grain: one row per product_id."
    primary_key: [product_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: product_id,              type: STRING,          nullable: false, description: "Unique security identifier (PK)"}
      - {name: id_type,                 type: STRING,          nullable: false, description: "Primary identifier type: CUSIP, ISIN, SEDOL, TICKER, BLOOMBERG_ID"}
      - {name: type,                    type: STRING,          nullable: false, description: "Product category: EQUITY, DEBT, FUND, DERIVATIVE, RIGHT"}
      - {name: sub_type,                type: STRING,          nullable: true,  description: "Subcategory: COMMON_STOCK, PREFERRED_STOCK, BOND, MUNI, POOL_BACKED, OPTION, FUTURE"}
      - {name: status,                  type: STRING,          nullable: false, description: "Lifecycle status: ACTIVE, INACTIVE, MATURED, SUSPENDED, DELISTED"}
      - {name: settlement_type,         type: STRING,          nullable: true,  description: "Settlement method"}
      - {name: description,             type: STRING,          nullable: true,  description: "Human-readable security name"}
      - {name: issue_date,              type: DATE,            nullable: true,  description: "Date the security was issued"}
      - {name: issue_price,             type: DECIMAL(28,8),   nullable: true,  description: "Price at issuance"}
      - {name: current_face_value,      type: DECIMAL(28,8),   nullable: true,  description: "Current face/par value"}
      - {name: issuer_legal_entity_id,  type: STRING,          nullable: true,  description: "FK to legal_entity.legal_entity_id"}
      - {name: tick_ladder_scale_id,    type: STRING,          nullable: true,  description: "FK to tick_ladder_scale.tick_ladder_scale_id"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  # -----------------------------------------------------------------------
  # LEGACY / SHADOW TABLE
  # -----------------------------------------------------------------------
  - name: generic_product
    source_file: generic_product.csv
    description: "Deprecated legacy shadow of product. One product can have MANY generic_product rows — no PK uniqueness enforced. Retained for backward compatibility only."
    primary_key: []
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: product_id,        type: STRING,  nullable: false, description: "FK to product.product_id (non-unique in this table)"}
      - {name: generic_product_id,type: STRING,  nullable: true,  description: "Legacy generic product identifier"}
      - {name: name,              type: STRING,  nullable: true,  description: "Legacy product name"}
      - {name: code,              type: STRING,  nullable: true,  description: "Legacy product code"}
      - {name: type,              type: STRING,  nullable: true,  description: "Legacy type descriptor"}
      - {name: sub_type,          type: STRING,  nullable: true,  description: "Legacy subtype descriptor"}
      - {name: status,            type: STRING,  nullable: true,  description: "Legacy status"}
      - {name: description,       type: STRING,  nullable: true,  description: "Legacy description"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  # -----------------------------------------------------------------------
  # REFERENCE / DIMENSION TABLES
  # -----------------------------------------------------------------------
  - name: legal_entity
    source_file: legal_entity.csv
    description: "Issuers and counterparties. Bitemporal entity — SCD2 applied in Silver. Grain: one row per legal_entity_id."
    primary_key: [legal_entity_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: legal_entity_id, type: STRING, nullable: false, description: "Unique entity identifier (PK)"}
      - {name: legal_name,      type: STRING, nullable: false, description: "Legal entity name"}
      - {name: country,         type: STRING, nullable: true,  description: "ISO 3166-1 alpha-2 country code"}
      - {name: entity_type,     type: STRING, nullable: true,  description: "BANK, CORPORATE, GOVERNMENT, etc."}
      - {name: status,          type: STRING, nullable: true,  description: "Entity lifecycle status"}
      - {name: lei_code,        type: STRING, nullable: true,  description: "Legal Entity Identifier (LEI) code"}
      - {name: incorporation_date, type: DATE, nullable: true, description: "Date of legal incorporation"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: currency
    source_file: currency.csv
    description: "ISO 4217 currency reference. Contains 15 valid rows and 2 deliberately seeded bad rows (DQ test data). Grain: one row per currency_code."
    primary_key: [currency_code]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: currency_code,   type: STRING, nullable: false, description: "ISO 4217 3-letter currency code (PK)"}
      - {name: currency_name,   type: STRING, nullable: true,  description: "Full currency name"}
      - {name: currency_symbol, type: STRING, nullable: true,  description: "Currency symbol"}
      - {name: country,         type: STRING, nullable: true,  description: "Issuing country"}
      - {name: is_active,       type: STRING, nullable: true,  description: "Active flag"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: series
    source_file: series.csv
    description: "Optional grouping dimension for Stock and ListedDerivative products. Grain: one row per series_id."
    primary_key: [series_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: series_id,    type: STRING, nullable: false, description: "Unique series identifier (PK)"}
      - {name: series_name,  type: STRING, nullable: true,  description: "Series name"}
      - {name: series_code,  type: STRING, nullable: true,  description: "Series code"}
      - {name: description,  type: STRING, nullable: true,  description: "Series description"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: tick_ladder_scale
    source_file: tick_ladder_scale.csv
    description: "Minimum price increment scale definition. Grain: one row per tick_ladder_scale_id."
    primary_key: [tick_ladder_scale_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: tick_ladder_scale_id, type: STRING,         nullable: false, description: "Unique tick ladder scale identifier (PK)"}
      - {name: name,                 type: STRING,         nullable: true,  description: "Scale name"}
      - {name: description,          type: STRING,         nullable: true,  description: "Scale description"}
      - {name: currency_code,        type: STRING,         nullable: true,  description: "Currency this scale applies to"}
      - {name: effective_date,       type: DATE,           nullable: true,  description: "Date from which scale is effective"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: tick
    source_file: tick.csv
    description: "Individual tick entries within a tick ladder scale. Grain: one row per tick_id."
    primary_key: [tick_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: tick_id,              type: STRING,        nullable: false, description: "Unique tick identifier (PK)"}
      - {name: tick_ladder_scale_id, type: STRING,        nullable: false, description: "FK to tick_ladder_scale.tick_ladder_scale_id"}
      - {name: lower_bound,          type: DECIMAL(28,8), nullable: true,  description: "Lower price bound for this tick entry"}
      - {name: upper_bound,          type: DECIMAL(28,8), nullable: true,  description: "Upper price bound for this tick entry"}
      - {name: tick_size,            type: DECIMAL(28,8), nullable: false, description: "Minimum price increment at this tier"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: principal_redemption_provision
    source_file: principal_redemption_provision.csv
    description: "Reference table for principal redemption provision types. Grain: one row per principal_redemption_provision_id."
    primary_key: [principal_redemption_provision_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: principal_redemption_provision_id, type: STRING, nullable: false, description: "Unique provision identifier (PK)"}
      - {name: provision_type,                    type: STRING, nullable: true,  description: "Type of redemption provision (e.g. CALL, PUT, SINKING_FUND)"}
      - {name: description,                       type: STRING, nullable: true,  description: "Provision description"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: product_rating_type
    source_file: product_rating_type.csv
    description: "Reference table for rating agency and rating scale types. Grain: one row per product_rating_type_id."
    primary_key: [product_rating_type_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: product_rating_type_id, type: STRING, nullable: false, description: "Unique rating type identifier (PK)"}
      - {name: rating_agency,          type: STRING, nullable: true,  description: "Rating agency name (e.g. MOODYS, SP, FITCH)"}
      - {name: rating_type_code,       type: STRING, nullable: true,  description: "Short code for the rating type"}
      - {name: rating_scale,           type: STRING, nullable: true,  description: "Rating scale description"}
      - {name: description,            type: STRING, nullable: true,  description: "Full description of this rating type"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  # -----------------------------------------------------------------------
  # RELATIONSHIP / EVENT TABLES
  # -----------------------------------------------------------------------
  - name: product_rating
    source_file: product_rating.csv
    description: "Credit ratings assigned to products. SCD2 applied in Silver. Grain: one row per product_rating_id."
    primary_key: [product_rating_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: product_rating_id,      type: STRING, nullable: false, description: "Unique rating record identifier (PK)"}
      - {name: product_id,             type: STRING, nullable: false, description: "FK to product.product_id"}
      - {name: product_rating_type_id, type: STRING, nullable: true,  description: "FK to product_rating_type.product_rating_type_id"}
      - {name: rating_value,           type: STRING, nullable: false, description: "Rating value (e.g. AAA, BBB-, BB+)"}
      - {name: rating_agency,          type: STRING, nullable: true,  description: "Rating agency that issued this rating"}
      - {name: effective_from_date,    type: DATE,   nullable: false, description: "Date this rating became effective"}
      - {name: effective_to_date,      type: DATE,   nullable: true,  description: "Date this rating was superseded (NULL = current)"}
      - {name: watch_code,             type: STRING, nullable: true,  description: "Rating watch status (POSITIVE, NEGATIVE, STABLE)"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: classification
    source_file: classification.csv
    description: "Industry and sector classifications for products (0..* per product). Grain: one row per classification_id."
    primary_key: [classification_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: classification_id,     type: STRING, nullable: false, description: "Unique classification record identifier (PK)"}
      - {name: product_id,            type: STRING, nullable: false, description: "FK to product.product_id"}
      - {name: classification_type,   type: STRING, nullable: true,  description: "Classification scheme (e.g. GICS, SIC, NAICS)"}
      - {name: classification_code,   type: STRING, nullable: true,  description: "Classification code within the scheme"}
      - {name: classification_name,   type: STRING, nullable: true,  description: "Human-readable classification name"}
      - {name: level,                 type: INTEGER, nullable: true,  description: "Hierarchy level within the classification scheme"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: identifiers
    source_file: identifiers.csv
    description: "All identifier aliases for a product (CUSIP, ISIN, SEDOL, TICKER, BLOOMBERG_ID). 0..* per product. Grain: one row per identifier_id."
    primary_key: [identifier_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: identifier_id,    type: STRING, nullable: false, description: "Unique identifier record PK"}
      - {name: product_id,       type: STRING, nullable: false, description: "FK to product.product_id"}
      - {name: id_type,          type: STRING, nullable: false, description: "Identifier scheme: CUSIP, ISIN, SEDOL, TICKER, BLOOMBERG_ID"}
      - {name: identifier_value, type: STRING, nullable: false, description: "The actual identifier string"}
      - {name: effective_date,   type: DATE,   nullable: true,  description: "Date from which this identifier is valid"}
      - {name: expiry_date,      type: DATE,   nullable: true,  description: "Date after which this identifier is no longer valid"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: coupon
    source_file: coupon.csv
    description: "Coupon payment schedule for bonds (0..* per bond). Grain: one row per coupon_id."
    primary_key: [coupon_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: coupon_id,       type: STRING,        nullable: false, description: "Unique coupon record identifier (PK)"}
      - {name: product_id,      type: STRING,        nullable: false, description: "FK to bond.product_id"}
      - {name: coupon_rate,     type: DECIMAL(18,8), nullable: false, description: "Annual coupon rate as a percentage"}
      - {name: payment_date,    type: DATE,          nullable: false, description: "Coupon payment date"}
      - {name: coupon_type,     type: STRING,        nullable: true,  description: "FIXED or FLOATING"}
      - {name: frequency,       type: STRING,        nullable: true,  description: "ANNUAL, SEMI_ANNUAL, QUARTERLY, MONTHLY"}
      - {name: accrual_start_date, type: DATE,       nullable: true,  description: "Start of coupon accrual period"}
      - {name: accrual_end_date,   type: DATE,       nullable: true,  description: "End of coupon accrual period"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  # -----------------------------------------------------------------------
  # BRIDGE / MANY-TO-MANY TABLES
  # -----------------------------------------------------------------------
  - name: listed_derivative_tick
    source_file: listed_derivative_tick.csv
    description: "Bridge table linking listed derivatives to applicable tick entries. Composite PK. Grain: one row per (product_id, tick_id)."
    primary_key: [product_id, tick_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: product_id, type: STRING, nullable: false, description: "FK to listed_derivative.product_id"}
      - {name: tick_id,    type: STRING, nullable: false, description: "FK to tick.tick_id"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: debt_principal_redemption_provision
    source_file: debt_principal_redemption_provision.csv
    description: "Bridge table linking debt instruments to principal redemption provisions. Composite PK. Grain: one row per (product_id, principal_redemption_provision_id)."
    primary_key: [product_id, principal_redemption_provision_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: product_id,                        type: STRING,        nullable: false, description: "FK to debt.product_id"}
      - {name: principal_redemption_provision_id, type: STRING,        nullable: false, description: "FK to principal_redemption_provision.principal_redemption_provision_id"}
      - {name: provision_amount,                  type: DECIMAL(28,8), nullable: true,  description: "Amount associated with this provision"}
      - {name: provision_date,                    type: DATE,          nullable: true,  description: "Date the provision takes effect"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  # -----------------------------------------------------------------------
  # PRODUCT SUBTYPE TABLES (Class-Table Inheritance)
  # -----------------------------------------------------------------------
  - name: fund
    source_file: fund.csv
    description: "Fund subtype extension of product. Grain: one row per product_id."
    primary_key: [product_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: product_id,       type: STRING, nullable: false, description: "FK to product.product_id (PK)"}
      - {name: endness_type,     type: STRING, nullable: true,  description: "OPEN_END or CLOSED_END"}
      - {name: mutual_fund_type, type: STRING, nullable: true,  description: "Fund subtype (e.g. EQUITY_FUND, BOND_FUND, MONEY_MARKET)"}
      - {name: nav_frequency,    type: STRING, nullable: true,  description: "NAV calculation frequency"}
      - {name: domicile_country, type: STRING, nullable: true,  description: "Country of fund domicile (ISO 3166-1 alpha-2)"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: right
    source_file: right.csv
    description: "Subscription rights subtype extension of product. Grain: one row per product_id."
    primary_key: [product_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: product_id,          type: STRING,        nullable: false, description: "FK to product.product_id (PK)"}
      - {name: subscription_price,  type: DECIMAL(28,8), nullable: true,  description: "Price at which the right can be exercised"}
      - {name: expiry_date,         type: DATE,          nullable: true,  description: "Date the subscription right expires"}
      - {name: underlying_product_id, type: STRING,      nullable: true,  description: "FK to product.product_id for the underlying security"}
      - {name: ratio,               type: DECIMAL(18,8), nullable: true,  description: "Number of rights per underlying share"}
    metadata_columns:
      - {name: _source_file,    type: STRING,    description: "Source CSV filename"}
      - {name: _ingestion_ts,   type: TIMESTAMP, description: "Timestamp when row was loaded to Bronze"}
      - {name: _batch_id,       type: STRING,    description: "Pipeline run identifier"}
      - {name: _row_hash,       type: STRING,    description: "SHA256 of all data columns for CDC"}
      - {name: _ingestion_date, type: DATE,      description: "Partition column derived from _ingestion_ts"}

  - name: debt
    source_file: debt.csv
    description: "Debt instrument subtype extension of product. Parent of bond and pool_backed_security. Grain: one row per product_id."
    primary_key: [product_id]
    partition_by: [_ingestion_date]
    iceberg_uniform: true
    columns:
      - {name: product_id,              type: STRING,        nullable: false, description: "FK to product.product_id (PK)"}
      - {name: total_amount_issued,     type: DECIMAL(28,8), nullable: true,  description: "Total face amount of the debt issue"}
      - {name: issue_date_settlement,   type: DATE,          nullable: true,  description: "Settlement date of issuance"}
