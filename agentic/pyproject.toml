[project]
name = "sml-pipeline"
version = "1.0.0"
description = "Securities Master Data Lakehouse BMAD Pipeline — Agentic CLI"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "anthropic>=0.25",
    "databricks-sdk>=0.20",
    "gitpython>=3.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "langfuse>=2.0",
]

[project.scripts]
sml = "agents.cli:main"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]
